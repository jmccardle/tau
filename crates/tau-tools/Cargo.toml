[package]
name = "tau-tools"
description = "The base tools (read, write, grep, bash). Filesystem and process IO; no PyO3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
fastrand = "2"
nix = { version = "0.30", default-features = false, features = ["signal", "process", "poll", "user", "fs", "dir"] }
globset = "0.4"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
