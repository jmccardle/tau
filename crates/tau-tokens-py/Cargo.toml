[package]
name = "tau-tokens-py"
description = "PyO3 bindings: exposes tau-tokens to Python as tau_tokens._core (the wheel ffwf-tau-tokens)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Not `_core`: tau-py's library has that name, and two libraries of one name in a workspace are
# one file in target/, so each build would hand the other's module to maturin. The Python module
# is still `tau_tokens._core` (the `#[pymodule]`'s name, and `module-name` in tokens/pyproject.toml).
name = "tau_tokens_core"
crate-type = ["cdylib"]

[features]
# Enabled for every maturin build (tokens/pyproject.toml), as in tau-py: one wheel for every GIL
# CPython >= 3.12; for 3.14t maturin ignores it and builds cp314t.
abi3 = ["pyo3/abi3-py312"]

[dependencies]
tau-tokens = { workspace = true }
pyo3.workspace = true

[lints]
workspace = true
