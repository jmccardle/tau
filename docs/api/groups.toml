# What is public, and for whom. scripts/api_docs.py reads this file; `tau.__all__` must list
# exactly the names without a dot, and docs/api/README.md must have a `## <title>` heading per
# group. A name is `Name` (`tau.Name`) or `module.name` (`tau.module.name`, for a public module).

# Classes tau makes and hands to a program (a handle, a client from `Driver.client` or
# `RemoteClient.connect`): their constructors are tau's own and are not part of the surface.
made_by_tau = ["Cursor", "NodeHandle", "TreeHandle", "Subject", "LocalClient", "RemoteClient", "Skills"]

# Packages other than tau and the standard library that a public signature may name. `httpx`: the
# provider classes take an `httpx` transport and timeout.
foreign_types = ["httpx", "textual"]

[[group]]
id = "extensions"
title = "Writing an extension"
reader = "An extension is a module that adds hooks, tools, commands and options to a session. These are the contract it implements and the handles its hooks are given."
names = [
    "Extension", "CursorHook", "ToolHook", "CallDraft", "Subject", "Cursor", "NodeHandle",
    "TreeHandle", "Form", "DefinitionError", "Model", "CursorId", "LabelName", "NodeId",
    "StepLimit", "Attachments", "Skills", "Usage", "Compaction", "Prune", "CURSOR_POINTS", "TOOL_POINTS",
]

[[group]]
id = "tools"
