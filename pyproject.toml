[project]
name = "ffwf-tau-monorepo"
version = "0.9.3"
description = "τ (tau-agent-core) monorepo"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tau-llm/tests", "tau-agent-core/tests", "tau-coding-agent/tests", "tau-jmfts/tests"]
asyncio_mode = "auto"
markers = [
    "jmfts: live integration tests against a running JMFTS server (JMFTS_TEST_URL or default LAN instance; skips if unreachable, never on a server error)",
    "llama: live conformance probe against a llama.cpp server (TAU_LLAMA_TEST_URL or default LAN instance; DESELECTED BY DEFAULT -- opt in with `pytest -m llama`; skips if unreachable, never on a server error)",
]
# `llama` is deselected by default; `jmfts` is NOT. The difference is COST, not
# availability. The jmfts gate is a 3-second HTTP probe, so attempting it and
# skipping is free. The llama suite is a generation sweep -- ~15 s of GPU time per
# run even when everything passes -- which does not belong in every `pytest`.
# Opt in with `pytest -m llama`: a command-line `-m` lands after addopts and wins.
# Re-run it ONLY for changes touching the LLM provider interfaces; see the module
# docstring of tau-llm/tests/test_llama_conformance.py for the scope rule.
addopts = ["-m", "not llama"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
# Lint + format gate (enforced by .git/hooks/pre-commit). Scope mirrors the
# mypy config: the four package src trees. line-length 100 keeps the format
# churn small relative to the existing code.
line-length = 100
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
# The rule set is STATED, not inherited. It used to be left implicit -- "ruff's
# defaults happen to be what we want" -- and that made the gate depend on which
# ruff version a clone installed, since `dev` pins no version. Measured on this
# tree: ruff 0.15.17 reports 0 errors and ruff 0.16.4 reports 293, because 0.16
# widened the default set (I, S, DTZ, FURB, PERF, TRY, …). A contributor whose
# install date differed by a few weeks got a red pre-commit hook on code they
# had not touched.
#
# Naming the four categories fixes that without pinning ruff: pyflakes (F) plus
# the pycodestyle subsets that are real errors rather than layout opinions. The
# formatter owns whitespace and wrapping, so E1/E2/E3 stay out to avoid fighting
# it. Import sorting (I) is still deferred to its own pass -- deliberately, and
# now visibly, rather than by accident of a version.
#
# The FORMATTER needs no such treatment: `ruff format --check` reports the same
# 90 files clean on both versions.
select = ["E4", "E7", "E9", "F"]
