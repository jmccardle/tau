[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"  # rules: allow(backend): PEP 517 key

[project]
name = "ffwf-tau"
description = "τ (tau): an agent harness with a Rust core, a Python driver, extensions and a terminal UI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fight Fire with Fire Robotics, LLC" }]
keywords = ["agent", "llm", "harness", "coding-agent", "tui", "openai", "anthropic", "gemini", "llama.cpp"]
dynamic = ["version"]
dependencies = ["httpx>=0.28", "websockets>=15", "textual>=8.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]

[project.optional-dependencies]
# Local tokenizers for the `tokens` extension (D26 §7): a second wheel built from this repository,
# always at this wheel's version (scripts/check_tokens_wheel.py holds the pin to it).
tokens = ["ffwf-tau-tokens==0.16.0.dev0"]

# The public repository only: pyproject.toml and README.md ship in the sdist and on PyPI.
[project.urls]
Repository = "https://github.com/jmccardle/tau"
Documentation = "https://github.com/jmccardle/tau/blob/master/docs/guide/README.md"
Issues = "https://github.com/jmccardle/tau/issues"

[project.scripts]
tau = "tau.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "pytest>=8",
    # tests/tui/test_snapshots.py compares SVGs of Textual's own drawing, so the drawing is pinned
    "textual==8.2.8",
    "rich==15.0.0",
    "pyte==0.8.2",  # tests/ptykit.py reads a screen back from a program that draws with cursor moves (examples/ratatui)
    "ruff>=0.14",
    "pyright>=1.1.400",
    "mypy>=2.4",  # stubtest only; pyright is the type checker
    "radon==6.0.1",  # scripts/pymetrics.py: rule 7 on python/tau
]

[tool.maturin]
manifest-path = "crates/tau-py/Cargo.toml"
module-name = "tau._core"
python-source = "python"
features = ["abi3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/behavior", "tests/providers", "tests/tui", "tests/tokens", "tests"]
addopts = ["--strict-markers"]
markers = [
    "local_only(reason): a behavior test of something a wire cannot carry; it runs with local clients only",
    "tokenizers: needs the tokenizer wheel (ffwf-tau-tokens); every test under tests/tokens has it, and without the wheel it is an error unless the run says -m 'not tokenizers'",
]
faulthandler_timeout = 120  # a hung test dumps every thread's stack instead of hanging silently

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["target", ".venv*", "docs/reference"]  # generated (scripts/api_docs.py)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C90", "PL", "PT", "TID", "SLF"]

[tool.ruff.lint.isort]
known-first-party = ["tau", "tau_tokens"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Rule 4: fakes live at the effect boundary (FakeProvider, FakeTool), not in patches."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"tests/tokens/**" = ["PLR2004", "RUF001"]  # text in many scripts is what a tokenizer is tested on
# The texts the tokenizers are compared on: long lines of every kind of character, on purpose.
"scripts/tokens_reference.py" = ["E501", "RUF001", "PLR2004"]
"python/tau/_core.pyi" = ["E501"]  # docstrings are copied from the Rust `///` (scripts/stub_docs.py)
"tokens/python/tau_tokens/_core.pyi" = ["E501"]

[tool.pyright]
include = ["python", "tokens/python", "tests", "examples"]
strict = ["python", "tokens/python"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["tests/behavior", "tests/providers", "tests/tui", "tests/tokens", "tests"]
