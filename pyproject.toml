[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"  # rules: allow(backend): PEP 517 key

[project]
name = "ffwf-tau-next"
description = "τ next (\"Trusty\"): Rust core, Python extensions."
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
dependencies = ["httpx>=0.28"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
]

[project.scripts]
tau = "tau_next.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "pytest>=8",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "mypy>=2.4",  # stubtest only; pyright is the type checker
]
# parity/ only: τ 0.15 as the oracle for the API diff. Never needed by tests/.
parity = ["ffwf-tau==0.15.0"]

[tool.maturin]
manifest-path = "crates/tau-py/Cargo.toml"
module-name = "tau_next._core"
python-source = "python"
features = ["abi3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/behavior", "tests/providers", "tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["target", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C90", "PL", "PT", "TID", "SLF"]

[tool.ruff.lint.isort]
known-first-party = ["tau_next"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Rule 4: fakes live at the effect boundary (FakeProvider, FakeTool), not in patches."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pyright]
include = ["python", "tests", "parity", "examples"]
strict = ["python"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["tests/behavior", "tests/providers", "tests"]
