[project]
name = "tau-coding-agent"
version = "0.0.0"
description = "τ-coding-agent: Interactive TUI (Textual) + CLI"
requires-python = ">=3.11"
dependencies = [
    "tau-agent-core",
    "textual>=0.47",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# bootstrap_config() reads tau_default_config.json out of the installed package on
# first run. Without this it is source-tree-only and `pip install tau-coding-agent`
# ships a τ that dies with FileNotFoundError before it can print a prompt.
# Covered by tests/test_config.py::test_the_packaged_template_is_shipped_and_valid.
[tool.setuptools.package-data]
tau_coding_agent = ["tau_default_config.json"]

[project.scripts]
tau = "tau_coding_agent.cli:main"
