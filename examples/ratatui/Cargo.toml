# Outside the root workspace (see the root `exclude`): a client of `tau serve` that shares no
# code with τ. Build from the repository root:
#   cargo build --release --locked --manifest-path examples/ratatui/Cargo.toml
[package]
name = "tau-ratatui"
description = "A terminal chat client of `tau serve`, written in Rust against the wire schema."
version = "0.18.0"
edition = "2024"
rust-version = "1.89"
publish = false

# The program is `trusty`: 0.16's code name, kept with the repository as its Rust client.
[[bin]]
name = "trusty"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
base64 = "0.22.1"
futures-util = "0.3.34"
gethostname = "1.1.0"
# The formats τ takes (D30): PNG, JPEG, GIF, WebP.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui = "0.30.2"
# No chafa (a C library): halfblocks are drawn by the crate itself.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.30.0"
unicode-width = "0.2.3"

[workspace]

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1.0.154"
syn = "2"
typify = "0.8.0"

[dev-dependencies]
tempfile = "3.27.0"
