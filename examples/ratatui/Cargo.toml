# Outside the root workspace (see the root `exclude`): a client of `tau serve` that shares no
# code with τ. Build from the repository root:
#   cargo build --release --locked --manifest-path examples/ratatui/Cargo.toml
[package]
name = "tau-ratatui"
description = "A terminal chat client of `tau serve`, written in Rust against the wire schema."
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.30.0"
unicode-width = "0.2.3"

[workspace]

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1.0.154"
syn = "2"
typify = "0.8.0"

[dev-dependencies]
tempfile = "3.27.0"
