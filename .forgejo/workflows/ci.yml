# CI for τ on forge.goblincorps.com. Fail early: no continue-on-error,
# no `|| true`.
#
# One runner, Linux x86_64. Nothing here builds or tests aarch64 or macOS,
# and nothing claims to (docs/plan.md amendments).
#
# `gate` runs scripts/check.sh, the same file developers run locally, with
# only the dev group installed: the test suite must pass without τ 0.15. It
# includes the wire steps: `scripts/schema.py --check` fails when
# docs/protocol.schema.json is not what the code generates (D21 §8), and the Rust example
# examples/ratatui (fmt, clippy -D warnings, cargo test; pytest builds and drives its binary).
# `wheels` builds portable manylinux2014 wheels (zig as the linker; no
# docker) and tests each installed in a clean venv. There are two wheels
# (D26 §7.1): ffwf-tau, and ffwf-tau-tokens from tokens/. `gate` builds both
# into its venv and fetches the real tokenizer files the second is tested on.

name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu
    strategy:
      fail-fast: true
      matrix:
        python: ["3.12", "3.14t"]
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/ratchet.py compares ratchet-allow.toml with its version at
          # the merge-base (or HEAD~1 on master): it needs history.
          fetch-depth: 0
      - name: toolchain
        run: scripts/ci-toolchain.sh ${{ matrix.python }}
      - name: dev group
        run: .venv/bin/pip install --group dev
      - name: tokenizer files
        # The tau_tokens tests compare against real tokenizer files: about 170 MB
        # from huggingface.co, each pinned to a commit and a sha256
        # (tests/fixtures/tokens/artifacts.json). They are not checked in.
        run: .venv/bin/python scripts/tokens_goldens.py fetch
      - name: scripts/check.sh
        # The ratchet's allowlist guard checks the whole push, not only its
        # last commit (all zeros on a new branch: ratchet.py falls back).
        # TAU_TOKENS_FILES=require: a missing tokenizer file fails the tests
        # that read it, where on a laptop it skips them with the reason.
        env:
          TAU_RATCHET_BASE: ${{ github.event.before }}
          TAU_TOKENS_FILES: require
        run: scripts/check.sh

  # Reported, never gating: coverage (Rust tests, then Python tests through the
  # instrumented cdylib) and the metrics tables. The numbers land in the job
  # log; docs/as-built/metrics/README.md says how to commit a fresh run.
  report:
    runs-on: ubuntu
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: TAU_CI_METRICS=1 scripts/ci-toolchain.sh 3.12
      - name: dev group
        run: .venv/bin/pip install --group dev
      - name: metrics
        run: scripts/metrics.sh
      - name: coverage
        run: scripts/coverage.sh

  wheels:
    runs-on: ubuntu
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        # 3.12 yields the cp312-abi3 wheel; 3.14t the version-specific one.
        python: ["3.12", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: scripts/ci-toolchain.sh ${{ matrix.python }}
      - name: build
        run: |
          set -euo pipefail
          .venv/bin/pip install "maturin>=1.15,<2" "ziglang==0.17.0"
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/maturin build --release --locked \
            --zig --compatibility manylinux2014 --out dist --interpreter .venv/bin/python
          # The second wheel, ffwf-tau-tokens (D26 §7.1): its own pyproject.toml,
          # the same workspace, lockfile and version.
          cd tokens
          PATH="$PWD/../.venv/bin:$PATH" ../.venv/bin/maturin build --release --locked \
            --zig --compatibility manylinux2014 --out ../dist --interpreter ../.venv/bin/python
          ls -l ../dist
      # Both test steps run from /tmp so the installed wheels, not the
      # checkout's python/ trees, are what gets imported.
      - name: tests/ against ffwf-tau alone, no τ 0.15, no tokenizers
        # The main wheel must work without the second: `-m "not tokenizers"`
        # leaves tests/tokens out, which is the only way a run may leave it out.
        run: |
          set -euo pipefail
          uv venv --seed --python ${{ matrix.python }} /tmp/clean
          # pytest and the test-only pins (pyte, one version in pyproject.toml's dev group)
          # come from that group; pip >= 25.1 reads a group from a pyproject path.
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install --group "$GITHUB_WORKSPACE/pyproject.toml:dev" dist/ffwf_tau-*.whl
          cd /tmp
          /tmp/clean/bin/python -m pytest -q -p no:cacheprovider -m "not tokenizers" "$GITHUB_WORKSPACE/tests"
      - name: tests/ against both wheels
        # Everything, tests/tokens included. The real tokenizer files are not
        # fetched in this job (`gate` requires them), so the tests that read
        # them skip here and say why.
        run: |
          set -euo pipefail
          uv venv --seed --python ${{ matrix.python }} /tmp/both
          /tmp/both/bin/pip install --upgrade pip
          /tmp/both/bin/pip install --group "$GITHUB_WORKSPACE/pyproject.toml:dev" dist/*.whl
          cd /tmp
          /tmp/both/bin/python -m pytest -q -p no:cacheprovider -rs "$GITHUB_WORKSPACE/tests"
      # No artifact upload. Job containers on this runner cannot reach the
      # forge's public URL, which is where Forgejo points the artifact
      # service (ECONNREFUSED on forge.goblincorps.com:443), and nothing
      # consumes the wheels before release. Restore it when release needs
      # CI-built wheels and the runner can route to the forge.
