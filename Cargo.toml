[workspace]
resolver = "3"
members = ["crates/tau-core", "crates/tau-store", "crates/tau-tools", "crates/tau-py"]
# Its own workspace and lockfile: encoders τ does not depend on.
exclude = ["crates/bench-formats"]

[workspace.package]
version = "0.16.0-dev.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://dev.ffwf.net/john/trusty"

[workspace.dependencies]
tau-core = { path = "crates/tau-core" }
tau-store = { path = "crates/tau-store" }
tau-tools = { path = "crates/tau-tools" }
pyo3 = { version = "0.30.1" }
proptest = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.5.3"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
