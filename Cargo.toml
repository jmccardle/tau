[workspace]
resolver = "3"
members = ["crates/tau-core", "crates/tau-store", "crates/tau-py"]

[workspace.package]
version = "0.16.0-dev.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://dev.ffwf.net/john/trusty"

[workspace.dependencies]
tau-core = { path = "crates/tau-core" }
tau-store = { path = "crates/tau-store" }
pyo3 = { version = "0.30.1" }
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
