[workspace]
resolver = "3"
members = [
    "crates/tau-core",
    "crates/tau-store",
    "crates/tau-tools",
    "crates/tau-py",
    # The second wheel, `ffwf-tau-tokens` (D26 §7): nothing above depends on these two.
    "crates/tau-tokens",
    "crates/tau-tokens-py",
]
# Their own workspaces and lockfiles: encoders τ does not depend on, and the Rust example client.
exclude = ["crates/bench-formats", "examples/ratatui"]

[workspace.package]
version = "0.16.0-dev.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/jmccardle/tau"

[workspace.dependencies]
tau-core = { path = "crates/tau-core" }
tau-store = { path = "crates/tau-store" }
tau-tools = { path = "crates/tau-tools" }
tau-tokens = { path = "crates/tau-tokens" }
pyo3 = { version = "0.30.1" }
proptest = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
crc32fast = "1.5.3"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
