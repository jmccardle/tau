[project]
name = "tau-jmfts"
version = "0.0.0"
description = "τ-jmfts: JMFTS (Fusion Tree Search) session store backend and REST client"
requires-python = ">=3.11"
dependencies = [
    "tau-agent-core",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
